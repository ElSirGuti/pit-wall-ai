[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pit-wall-ai"
version = "0.1.0"
description = "Real-time AI race engineer for Assetto Corsa: live telemetry, rule-based alerts and a voice assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andres Gutierrez" }]
keywords = ["assetto-corsa", "telemetry", "race-engineer", "motorsport", "gemini"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "numpy>=1.26",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = ["pywin32>=306; sys_platform == 'win32'", "sounddevice>=0.4"]
stt = ["faster-whisper>=1.0"]
stt-cuda = ["nvidia-cublas-cu12; sys_platform == 'win32'", "nvidia-cudnn-cu12; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pit-wall = "pit_wall_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pit_wall_ai = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "windows: needs Windows (named file mappings)",
    "real_data: needs a real ACTI log, set PIT_WALL_SAMPLE_LD",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
# Prose in docstrings and comments may run long; the formatter keeps the code itself at 100.
ignore = ["E501"]
