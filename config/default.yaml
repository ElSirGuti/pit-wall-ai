# Defaults of pit-wall-ai (these are also the built-in values). Copy to config/local.yaml to change them;
# local.yaml is git-ignored. Secrets do NOT go here: put GEMINI_API_KEY in .env.
# Valores por defecto (también son los incorporados). Copia a config/local.yaml para cambiarlos.
# Los secretos NO van aquí: pon GEMINI_API_KEY en .env.

telemetry:
  source: ac            # ac = the running game | replay = a recorded log
  hz: 60                # polling rate (the loop never waits for network or audio)
  buffer_seconds: 30    # seconds of history kept in memory
  retry_s: 1.0          # how often to retry when the game is not running
  replay:
    file: null          # .ld (ACTI / MoTeC) or MoTeC .csv
    speed: 1.0
    start_s: 0
    loop: false
    session: practice   # the log has no session type: practice | qualify | race | hotlap ...

logging:
  level: INFO           # DEBUG | INFO | WARNING | ERROR
  json_logs: false      # true = one JSON object per line
  file: null            # also write JSON lines to this file

llm:                    # phase 5; the provider is swappable
  provider: mock        # mock (offline) | gemini (HTTPS to Google, needs the key and allow_cloud)
  allow_cloud: false    # nothing is sent to a cloud model unless true. The free tier may use what is sent
                        # (the compact session summary and your question) to improve Google's products.
  model: gemini-flash-lite-latest  # the only place a model name lives; `pit-wall llm-check` lists the valid ones
  fallback_models: [gemini-3.1-flash-lite]   # tried in order when the model is overloaded (503) or times out, e.g. [gemini-3.5-flash]
  thinking_budget: null # tokens the model may think before answering, for every model (they count in
                        # max_output_tokens). A model that rejects it (HTTP 400) is retried without it.
  thinking_budgets: {}  # the same, per model; e.g. {gemini-3.5-flash: 0}. Wins over thinking_budget
  base_url: https://generativelanguage.googleapis.com/v1beta
  temperature: 0.2
  api_key_env: GEMINI_API_KEY
  timeout_s: 5          # a stuck call gives way to the reserve model after this long
  max_output_tokens: 300
  cache_ttl_s: 20
  rate_limit:           # adaptive: backs off on HTTP 429, creeps up while calls succeed
    adaptive: true
    initial_rpm: 6
    min_rpm: 1
    max_rpm: 10
    increase_every_ok: 10
    increase_step_rpm: 0.5
    decrease_factor: 0.5
    cooldown_after_429_s: 15
    daily_budget: 400   # hard cap of requests per day, or null. Failed calls count against Google's
                        # quota too; the Flash-Lite models showed 500/day and 15/min in AI Studio

engineer:               # phase 3: rule alerts spoken by the race engineer
  enabled: false        # opt in: `pit-wall run --voice` (or true here)
  language: es          # es | en : text AND voice language
  startup_quiet_s: 5    # silence right after a session starts / restarts
  voice:
    backend: sapi       # sapi = Windows voices (pip install -e ".[voice]") | command = your own synthesiser
                        # | console = print only | none
    output_device: null # part of the audio output name (a headset...); `pit-wall devices` lists them
    command: null       # for backend: command, e.g. 'piper --model C:/voices/es.onnx --output_file {out} {stdin}'
                        # {text} = the sentence as an argument, {stdin} = send it on standard input, {out} = the WAV
    name: null          # e.g. Sabina; null = first installed voice of the language
    rate: 1             # SAPI speed -10..10, 0 = normal
    volume: 100
  calm:                 # non-critical messages wait for these "the driver can listen" moments
    brake_below: 0.10   # brake pedal 0..1
    steer_below: 0.15   # fraction of the steering lock 0..1
    hold_s: 0.3         # both must hold this long
    min_gap_s: 1.5      # minimum silence between two messages
  policies:             # what may speak per session; priorities low < medium < high < critical
    practice: {min_priority: low, allow_rules: []}
    qualify: {min_priority: medium, allow_rules: []}
    race: {min_priority: critical, allow_rules: [lap_summary, fuel_low, penalty]}
    other: {min_priority: medium, allow_rules: []}
  # Thresholds start CONSERVATIVE on purpose: a chatty engineer gets switched off.
  # Every alert is logged with its rule and the values that fired it ("alert fired"):
  # calibrate from that log (run with a replay or record the session). `pit-wall rules` lists all of this.
  rules:
    lockup:
      enabled: true
      ratio: 0.70         # wheel speed / car speed below this = locked (real MX-5 braking: p1 0.65)
      min_speed_kmh: 50
      min_brake: 0.40     # only while really braking
      hold_s: 0.25
      cooldown_s: 12
    wheelspin:
      enabled: false      # chatty on slow corners
      ratio: 1.30
      min_gas: 0.70
      min_speed_kmh: 20
      hold_s: 0.4
      cooldown_s: 20
    spin:
      enabled: true
      slip_angle_deg: 60  # angle between the car heading and its direction of travel
      min_speed_kmh: 30
      hold_s: 0.15
      cooldown_s: 10
    offtrack:
      enabled: true
      wheels_out: 3
      hold_s: 1.0
      min_speed_kmh: 20
      cooldown_s: 20
    fuel:
      enabled: true
      warn_laps: 2.0      # "fuel for N laps" at or below this
      critical_laps: 0.8  # interrupts at or below this
      laps_for_estimate: 2
      cooldown_s: 90
    tyre_temp:
      enabled: true
      hot_c: 115          # core temperature; CALIBRATE per compound (unverified windows)
      rearm_c: 105        # must drop below this before it can warn again
      hold_s: 3.0
      cooldown_s: 90
    tyre_pressure:
      enabled: true
      high_psi: 40
      puncture_drop_psi: 4   # a drop this fast is a puncture, not a cooling tyre
      puncture_window_s: 3
      cooldown_s: 60
    brake_temp:
      enabled: true
      hot_c: 800
      alive_range_c: 8    # the sensor must move this much, else it is ignored (flat on the Supra GT4)
      cooldown_s: 90
    penalty:
      enabled: true
      cooldown_s: 5
    flags:
      enabled: false      # UNVERIFIED: no flag seen in a real capture
      cooldown_s: 10
    damage:
      enabled: false      # UNVERIFIED: no damage seen in a real capture
      min_increase: 5
      cooldown_s: 10
    lap_summary:
      enabled: true
      include_delta: true
    best_sector:
      enabled: false      # chatty: one per sector, every lap
      cooldown_s: 0
    braking_hint:         # after a lap: the corner with a braking-point difference vs your best valid lap
      enabled: true       # needs the track in your game install; practice/qualify only (race policy drops it)
      cooldown_s: 0

analysis:               # phase 4: track geometry and braking analysis
  ac_dirs: []           # folders to search for the game's tracks: the game folder, a Steam library or its
                        # content/tracks. Empty = look in the usual Steam locations and in $AC_PATH.
                        # e.g. ["E:/SteamLibrary", "D:/SteamLibrary"]
  verified_numbering: [] # track ids whose corner numbering you have checked against the real circuit;
                        # only for those (or corners with a known name) does the voice say the corner
  braking:              # braking per corner vs the best valid lap of the session (same compound)
    brake_on: 0.10      # pedal above this = braking
    min_peak: 0.30      # an event must reach this to count as the braking of a corner
    lookback_m: 350     # how far before the corner entry the braking is searched
    merge_gap_m: 20     # braking events closer than this are one
    throttle_on: 0.50   # throttle above this after the slowest point = back on power
    min_distance_m: 10  # a braking-point difference smaller than this is never said
    min_time_s: 0.10    # a time loss in the corner smaller than this is never said
    big_loss_s: 0.50    # a loss this big is said even without a braking point (no brake there, or it ran on)

chat:                   # phase 5: the text conversation (`pit-wall ask`, `pit-wall chat`)
  history_turns: 6      # previous question/answer pairs sent along with a question
  stale_after_s: 5      # telemetry older than this is announced as such in a model answer

input:                  # phase 6: buttons bound to actions (see docs/INPUT_BINDINGS.md)
  poll_hz: 200          # joystick polling; keyboard and mouse are event driven
  bindings: {}          # use `pit-wall bind push_to_talk` (writes config/bindings.yaml); or by hand, e.g.
                        #   push_to_talk: [{kind: joy, device: "046d:c24f", button: 7}, {kind: key, key: F9}]

audio:                  # phase 6: the microphone for push-to-talk
  input_device: null    # part of the microphone name (a headset, the desk mic...); `pit-wall devices` lists them
  preroll_ms: 200       # audio kept from before the button went down (the first syllable)
  tail_ms: 150          # and after it went up
  min_utterance_ms: 300 # shorter than this is an accidental touch and is dropped
  keep_audio: false     # keep the last utterances on disk to debug the recognition (never committed)

stt:                    # phase 6: speech recognition (pip install -e ".[stt]"); `pit-wall stt-test`
  backend: faster-whisper
  model: small          # tiny | base | small | medium
  device: auto          # auto | cpu | cuda: a per-game choice (CPU-hungry sims: try cuda; AC: cpu is fine)
  compute_type: auto    # auto | int8 | float16 | int8_float16
  threads: 4            # CPU threads for the recogniser
  beam_size: 1          # 1 = fastest
  language: null        # null = the engineer's language
  model_dir: null       # where models are stored; null = the Hugging Face cache
