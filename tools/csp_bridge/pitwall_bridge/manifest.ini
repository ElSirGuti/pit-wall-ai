[ABOUT]
NAME = Pit Wall Bridge
AUTHOR = pit-wall-ai
VERSION = 0.3.0
DESCRIPTION = Sends the real tyre wear (and the car state the classic shared memory lacks) to pit-wall-ai on 127.0.0.1. Reads only; draws one status line.

[CORE]
LAZY = NONE  ; load at startup and keep running: the engineer needs the data even when the window is hidden

[WINDOW_...]
ID = main
NAME = Pit Wall Bridge
FUNCTION_MAIN = windowMain
SIZE = 260, 70
FLAGS = AUTO_RESIZE
